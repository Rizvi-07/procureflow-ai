name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: procureflow_ci
          # Public disposable CI-only credential, never a deployment secret.
          POSTGRES_PASSWORD: procureflow_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U procureflow_ci -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://procureflow_ci:procureflow_ci_only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal gen migrations)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet Go
        run: go vet ./...
      - name: Test Go including isolated PostgreSQL integration tests
        shell: bash
        run: |
          go test -v -count=1 ./... | tee "$RUNNER_TEMP/go-tests.log"
          if grep -Fq 'PostgreSQL integration NOT RUN' "$RUNNER_TEMP/go-tests.log"; then
            echo '::error::Configured PostgreSQL integration tests skipped; investigate the service or test role.'
            exit 1
          fi
      - name: Build Go
        run: go build ./...

  frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend unit and component tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
