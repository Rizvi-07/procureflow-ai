syntax = "proto3";

package procureflow.v1;
option go_package = "procureflow-ai/gen/procureflow/v1;procureflowv1";

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_PENDING = 1;
  STATUS_APPROVED = 2;
  STATUS_REJECTED = 3;
}

message Purchase {
  string id = 1;
  string client_request_id = 2;
  string employee_id = 3;
  string item_name = 4;
  int64 quantity = 5;
  int64 unit_price_cents = 6;
  int64 total_cents = 7;
  Status status = 8;
}

message Approval {
  // One approval per purchase; purchase_id is also the approval lookup key.
  string purchase_id = 1;
  Status status = 2;
}

message CreatePurchaseRequest {
  // 1-128 ASCII letters, digits, underscores or hyphens; starts alphanumeric.
  // Reuse with different purchase details returns ALREADY_EXISTS.
  string client_request_id = 1;
  string employee_id = 2;
  string item_name = 3;
  int64 quantity = 4;
  int64 unit_price_cents = 5;
}
message GetPurchaseRequest { string purchase_id = 1; }
message ListPurchasesRequest {}
message ListPurchasesResponse { repeated Purchase purchases = 1; }
message SetApprovalStatusRequest {
  string purchase_id = 1;
  Status status = 2;
}
message CreateApprovalRequest { string purchase_id = 1; }
message GetApprovalRequest { string purchase_id = 1; }
message ListApprovalsRequest {}
message ListApprovalsResponse { repeated Approval approvals = 1; }
message DecideApprovalRequest {
  string purchase_id = 1;
  // Only APPROVED or REJECTED. Repeating the same decision retries propagation.
  Status status = 2;
}

service PurchaseService {
  rpc CreatePurchase(CreatePurchaseRequest) returns (Purchase);
  rpc GetPurchase(GetPurchaseRequest) returns (Purchase);
  rpc ListPurchases(ListPurchasesRequest) returns (ListPurchasesResponse);
  rpc SetApprovalStatus(SetApprovalStatusRequest) returns (Purchase);
}
service ApprovalService {
  rpc CreateApproval(CreateApprovalRequest) returns (Approval);
  rpc GetApproval(GetApprovalRequest) returns (Approval);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (Approval);
}
